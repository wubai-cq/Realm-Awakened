<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020407" />
    <title>六合初鸣 · Scenes 01–03</title>
  </head>
  <body>
    <main id="app" aria-label="六合初鸣前三段镜头">
      <canvas id="scene" aria-label="滚烫等离子体与声波粒子场"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <header class="title-lockup">
        <p class="eyebrow">SCENE 01 / PRIMORDIAL PLASMA</p>
        <h1>六合初鸣</h1>
        <p class="title-sub">很久以前，声音还没有名字。</p>
      </header>
      <div id="labels" aria-hidden="true"></div>
      <aside id="epoch-marker" class="epoch-marker" aria-hidden="true">
        <p>RECOMBINATION EPOCH</p>
        <strong>t ≈ 380,000 yr</strong>
        <span>z ≈ 1100 · T ≈ 3000 K</span>
        <span>v<sub>b</sub>/v₀ = <b id="baryon-velocity">1.000</b></span>
      </aside>
      <aside id="impact-marker" class="impact-marker" aria-hidden="true">
        <p>SIXFOLD CORE IMPACT</p>
        <strong><b id="impact-count">00</b> / 01</strong>
        <span>J = ∫F dt = Δp</span>
      </aside>
      <div id="wave-equation" class="wave-equation" aria-hidden="true">
        <svg class="wave-equation-trace" viewBox="0 0 460 128" preserveAspectRatio="none">
          <path id="wave-equation-path" d="M -20 92 C 54 8, 110 114, 190 58 S 330 16, 480 84" />
        </svg>
        <p class="wave-equation-main">f′ = f₀ · c / (c − v)</p>
        <p class="wave-equation-values">
          <span class="source-value">f₀=<b id="wave-f0">440</b> Hz</span>
          <span>v=<b id="wave-v">0.00</b>c</span>
          <span>f′≈<b id="wave-fp">440</b> Hz</span>
        </p>
      </div>
      <div class="caption-lockup">
        <p id="subtitle" class="subtitle"></p>
        <p id="caption" class="caption">原初光子 · 重子 · 声压峰</p>
      </div>
      <div class="control-rail" aria-label="播放控制">
        <button id="play" class="icon-button" type="button" title="播放" aria-label="播放"><i data-lucide="play"></i></button>
        <button id="reset" class="icon-button" type="button" title="重置" aria-label="重置"><i data-lucide="rotate-ccw"></i></button>
        <span id="timecode" class="timecode">00:00.00 / 00:16.17</span>
        <span class="fps-mark">30 FPS</span>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="legend-dot hot"></i>天体等离子</span>
        <span><i class="legend-dot wave"></i>声波包</span>
      </div>
      <audio id="narration" preload="auto" src="/audio-scene-01.wav"></audio>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
