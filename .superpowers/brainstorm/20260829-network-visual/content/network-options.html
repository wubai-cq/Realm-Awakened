<style>
  .network-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:18px; }
  .network-card { background:#070b12; border:1px solid rgba(151,220,255,.22); border-radius:8px; padding:14px; cursor:pointer; transition:border-color .2s, transform .2s; }
  .network-card:hover { border-color:rgba(151,220,255,.8); transform:translateY(-2px); }
  .network-card h3 { margin:0 0 8px; color:#dff8ff; font-size:16px; }
  .network-card p { margin:8px 0 0; color:rgba(220,236,244,.7); font-size:12px; line-height:1.5; }
  .network-card svg { width:100%; height:210px; display:block; background:#000; border-radius:5px; }
  .hint { color:rgba(220,236,244,.66); font-size:13px; }
  @media (max-width: 900px) { .network-grid { grid-template-columns:1fr; } }
</style>
<h2>第五段神经网连线方向</h2>
<p class="subtitle">三种都保留空洞、节点、纤维和断裂边缘，只改变主干组织方式</p>
<div class="network-grid" data-multiselect>
  <div class="network-card" data-choice="A" onclick="toggleSelect(this)">
    <svg viewBox="0 0 360 210" aria-label="中央主干与枝梢">
      <rect width="360" height="210" fill="#000"/>
      <g stroke="#a8efff" stroke-width="1.5" fill="none" opacity=".9">

    </svg>
    <h3>A · 中央主干 + 周边枝梢</h3>
    <p>一条偏斜主干贯穿画面，短枝向外脱落。最像参考图的“主丝 + 分叉 + 长尾”。</p>
  </div>
  <div class="network-card" data-choice="B" onclick="toggleSelect(this)">
    <svg viewBox="0 0 360 210" aria-label="多核心团簇与跨空洞纤维">
      <rect width="360" height="210" fill="#000"/>
      <g stroke="#a8efff" stroke-width="1.25" fill="none" opacity=".88">

      </g>
      <g fill="#e9fbff"><circle cx="98" cy="88" r="4"/><circle cx="214" cy="79" r="4"/><circle cx="157" cy="126" r="5"/></g>
    </svg>
    <h3>B · 多核心团簇 + 跨空洞纤维</h3>
    <p>三个亮节点团簇彼此牵引，中间留出黑色空洞。空间感最强，但主方向更分散。</p>
  </div>
  <div class="network-card" data-choice="C" onclick="toggleSelect(this)">
    <svg viewBox="0 0 360 210" aria-label="纵向脊柱与横向突触带">
      <rect width="360" height="210" fill="#000"/>
      <g stroke="#a8efff" stroke-width="1.35" fill="none" opacity=".9">

        <path d="M112 36 L126 12 M72 58 L54 86 M231 65 L246 28 M278 76 L310 94 M116 108 L96 78 M76 132 L58 168 M236 128 L254 172 M282 148 L314 184"/>
      </g>
      <g fill="#e9fbff"><circle cx="178" cy="18" r="3"/><circle cx="183" cy="82" r="5"/><circle cx="187" cy="145" r="4"/></g>
    </svg>
    <h3>C · 纵向脊柱 + 横向突触带</h3>
    <p>一条垂直信号脊柱贯穿泡沫方体，横向纤维像突触带扩散。方向明确，神经感最强。</p>
  </div>
</div>
<p class="hint">请点击你要采用的方向；也可以直接回复“以 A 为主、混合 B 的多核心”。</p>
