  .c6 .pulse,.c6 .ring{left:18%;top:49%}.c6 .scar{left:2%;top:48%;transform:rotate(0deg);height:3px;background:linear-gradient(90deg,transparent,#fff6d4,#79d7e9);filter:drop-shadow(0 0 7px #fff)}.c6 .path{left:73%;top:19%;width:64%;transform:rotate(151deg)}

</style>

<h2>修订：一个声波，依次撞击六合</h2>
<p class="subtitle">单一波包沿反射轨迹运动；每次只点亮一个方位，观众能清楚数到六。</p>

<div class="timeline">
  <div class="cell c1"><span class="num">01<span class="direction">东 · +X</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
  <div class="cell c2"><span class="num">02<span class="direction">天 · +Y</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
  <div class="cell c3"><span class="num">03<span class="direction">南 · +Z</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
  <div class="cell c4"><span class="num">04<span class="direction">地 · −Y</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
  <div class="cell c5"><span class="num">05<span class="direction">北 · −Z</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
  <div class="cell c6"><span class="num">06 · 乍裂<span class="direction">西 · −X</span></span><i class="path"></i><i class="scar"></i><i class="ring"></i><i class="pulse"></i></div>
</div>

<div class="formula">
  <div><strong>波包传播</strong><br>x(t)=x₀+cₛt·u</div>
  <div><strong>镜面反射</strong><br>u′=u−2(u·n)n</div>
</div>
<p class="story">前五次撞击各留下一圈极淡的高斯声痕；第六次撞击不是普通反弹，而是击穿边界。能量沿此前五道路径倒灌，六个撞击点按原顺序快速复亮并裂开，最后全部降为冷青色残痕，直接接入“那声波就此被冻结在黑暗深处”。</p>
